<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verbes irréguliers allemands – entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F6FA;
  --paper: #FFFFFF;
  --ink: #1E2A44;
  --muted: #5B6680;
  --line: #D6DCE8;
  --aqua: #7FE0E6;
  --green: #74DB6A;
  --yellow: #EEF23A;
  --orange: #FFB43A;
  --violet: #DDA6F5;
  --ok: #1F8A3B;
  --ko: #C2342B;
  --warn: #A86400;
  --btn: #1E2A44;
  --btn-ink: #FFFFFF;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141826; --paper: #1D2234; --ink: #E8ECF6; --muted: #A3ABC2; --line: #333B55;
    --aqua: #2E8C92; --green: #3C8F36; --yellow: #8E9120; --orange: #A86A12; --violet: #7E4E96;
    --ok: #5FD07A; --ko: #FF7A70; --warn: #F0B04A; --btn: #E8ECF6; --btn-ink: #141826;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141826; --paper: #1D2234; --ink: #E8ECF6; --muted: #A3ABC2; --line: #333B55;
  --aqua: #2E8C92; --green: #3C8F36; --yellow: #8E9120; --orange: #A86A12; --violet: #7E4E96;
  --ok: #5FD07A; --ko: #FF7A70; --warn: #F0B04A; --btn: #E8ECF6; --btn-ink: #141826;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 17px; line-height: 1.5;
}
main { max-width: 620px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
h1 { font-size: 1.7rem; line-height: 1.2; margin: .5rem 0 .4rem; font-weight: 700; }
h1 .hl { background: linear-gradient(transparent 55%, var(--yellow) 55%); padding: 0 .15em; }
p.lead { color: var(--muted); margin: 0 0 1.5rem; }
.hidden { display: none !important; }

.modes { display: grid; gap: .75rem; }
.range-title { font-weight: 500; margin: 0 0 .5rem; }
.range { display: flex; gap: .5rem; margin: 0 0 1.25rem; flex-wrap: wrap; }
.range label { cursor: pointer; position: relative; }
.range input { position: absolute; opacity: 0; pointer-events: none; }
.range span { display: inline-block; padding: .45rem .95rem; border-radius: 999px; border: 2px solid var(--line); background: var(--paper); font-weight: 500; }
.range input:checked + span { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.range input:focus-visible + span { outline: 3px solid var(--orange); outline-offset: 2px; }
.mode {
  text-align: left; width: 100%; padding: 1rem 1.1rem; border-radius: 14px;
  border: 2px solid var(--line); background: var(--paper); color: var(--ink);
  font: inherit; cursor: pointer;
}
.mode strong { display: block; font-size: 1.1rem; }
.mode span { color: var(--muted); font-size: .95rem; }
.mode:hover { border-color: var(--ink); }
.mode:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

details { margin-top: 1.75rem; }
summary {
  cursor: pointer; font-weight: 700; font-size: 1.1rem; list-style: none;
  display: flex; justify-content: space-between; align-items: center;
  padding: 1rem 1.1rem; border-radius: 14px; border: 2px solid var(--line); background: var(--paper);
}
summary::-webkit-details-marker { display: none; }
summary::after { content: "▾"; font-size: 1.3rem; line-height: 1; transition: transform .2s; }
details[open] summary::after { transform: rotate(180deg); }
summary:hover { border-color: var(--ink); }
summary:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.table-wrap { overflow-x: auto; margin-top: .75rem; background: var(--paper); border-radius: 12px; border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: 1rem; min-width: 560px; }
th, td { padding: .45rem .6rem; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-weight: 500; }
th.c-inf { background: var(--aqua); } th.c-pres { background: var(--green); }
th.c-pret { background: var(--yellow); } th.c-parf { background: var(--orange); } th.c-fr { background: var(--violet); }
tr:last-child td { border-bottom: 0; }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
.link { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; padding: .3rem 0; text-decoration: underline; }
.progress { display: flex; gap: 5px; flex-wrap: wrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.dot.done { background: var(--green); border-color: var(--green); }
.dot.missed { background: var(--orange); border-color: var(--orange); }
.dot.current { border-color: var(--ink); }

.card { background: var(--paper); border-radius: 18px; padding: 1.4rem 1.2rem; border: 1px solid var(--line); }
.prompt { margin-bottom: 1.2rem; }
.prompt .big { font-size: 2rem; font-weight: 700; line-height: 1.15; word-break: break-word; }
.prompt .sub { color: var(--muted); margin-top: .2rem; }

.field { margin-bottom: 1.1rem; }
.field label { display: inline-block; font-weight: 500; font-size: .95rem; margin-bottom: .3rem; padding: 0 .3em; border-radius: 4px; }
.f-inf label { background: var(--aqua); } .f-pres label { background: var(--green); }
.f-pret label { background: var(--yellow); } .f-parf label { background: var(--orange); }
.row { display: flex; align-items: baseline; gap: .5rem; }
.pron { font-weight: 500; color: var(--muted); }
.field input {
  flex: 1; min-width: 0; font: inherit; font-size: 1.15rem; color: var(--ink);
  background: transparent; border: 0; border-bottom: 3px solid var(--line);
  padding: .35rem .1rem; border-radius: 0;
}
.f-inf input:focus { border-color: var(--aqua); } .f-pres input:focus { border-color: var(--green); }
.f-pret input:focus { border-color: var(--yellow); } .f-parf input:focus { border-color: var(--orange); }
.field input:focus { outline: none; }
.field.ok input { border-color: var(--ok); }
.field.ko input { border-color: var(--ko); }
.fb { font-size: .95rem; margin-top: .3rem; min-height: 0; }
.field.ok .fb { color: var(--ok); }
.field.ko .fb { color: var(--ko); }
.fb .note { color: var(--warn); display: block; }

.keys { display: flex; gap: .5rem; margin: .4rem 0 1.2rem; }
.key {
  font: inherit; font-size: 1.15rem; width: 48px; height: 44px; border-radius: 10px;
  border: 2px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
}
.key:active { transform: translateY(1px); }

.main-btn {
  width: 100%; font: inherit; font-weight: 700; font-size: 1.1rem; padding: .85rem 1rem;
  border-radius: 12px; border: 0; background: var(--btn); color: var(--btn-ink); cursor: pointer;
}
.verdict { font-weight: 700; margin: 0 0 1rem; font-size: 1.05rem; }
.verdict.good { color: var(--ok); } .verdict.bad { color: var(--ko); }

.result .score { font-size: 3.2rem; font-weight: 700; line-height: 1; margin: .5rem 0; }
.result ul { padding-left: 1.2rem; }
.result li { margin-bottom: .3rem; }
.btns { display: grid; gap: .6rem; margin-top: 1.4rem; }
.second-btn {
  width: 100%; font: inherit; font-weight: 500; padding: .8rem 1rem; border-radius: 12px;
  border: 2px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer;
}
@media (prefers-reduced-motion: no-preference) {
  .card.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
}
</style>
</head>
<body>
<main>

  <section id="home">
    <a class="link" href="../">← Tous les quiz</a>
    <h1>Verbes irréguliers : <span class="hl">les 20 premiers</span></h1>
    <p class="lead">De <em>anfangen</em> à <em>fliegen</em>. Les verbes ratés reviennent à la fin jusqu’à ce que tout soit juste.</p>
    <p class="range-title">Quels verbes ?</p>
    <div class="range" role="radiogroup">
      <label><input type="radio" name="range" value="a"><span>1 à 10</span></label>
      <label><input type="radio" name="range" value="b"><span>11 à 20</span></label>
      <label><input type="radio" name="range" value="all" checked><span>Les 20</span></label>
    </div>
    <div class="modes">
      <button class="mode" data-mode="forms">
        <strong>Les trois formes</strong>
        <span>On te donne l’infinitif, tu écris le présent, le prétérit et le parfait.</span>
      </button>
      <button class="mode" data-mode="fr">
        <strong>À partir du français</strong>
        <span>On te donne la traduction, tu écris l’infinitif et les trois formes.</span>
      </button>
    </div>
    <details>
      <summary>Revoir la liste</summary>
      <div class="table-wrap"><table id="list"></table></div>
    </details>
  </section>

  <section id="quiz" class="hidden">
    <div class="topbar">
      <div class="progress" id="progress"></div>
      <button class="link" id="quit">Quitter</button>
    </div>
    <div class="card" id="card">
      <div class="prompt" id="prompt"></div>
      <div id="fields"></div>
      <div class="keys" id="keys">
        <button class="key" type="button">ä</button>
        <button class="key" type="button">ö</button>
        <button class="key" type="button">ü</button>
        <button class="key" type="button">ß</button>
      </div>
      <p class="verdict hidden" id="verdict"></p>
      <button class="main-btn" id="action">Vérifier</button>
    </div>
  </section>

  <section id="result" class="hidden result">
    <div class="card">
      <p style="margin:0;color:var(--muted)">Justes du premier coup</p>
      <div class="score" id="score"></div>
      <p id="comment"></p>
      <div id="missed"></div>
      <div class="btns">
        <button class="main-btn" id="again">Recommencer</button>
        <button class="second-btn" id="home-btn">Changer d’exercice</button>
      </div>
    </div>
  </section>

</main>
<script>
const VERBS = [
  { inf: "anfangen",  pres: "fängt an",  pret: "fing an",  parf: "hat angefangen",  fr: "commencer", frHint: "commencer (verbe à particule séparable)", star: true },
  { inf: "aufstehen", pres: "steht auf", pret: "stand auf", parf: "ist aufgestanden", fr: "se lever" },
  { inf: "ausleihen", pres: "leiht aus", pret: "lieh aus", parf: "hat ausgeliehen",  fr: "emprunter" },
  { inf: "beginnen",  pres: "beginnt",   pret: "begann",   parf: "hat begonnen",     fr: "commencer", frHint: "commencer (sans particule)" },
  { inf: "bekommen",  pres: "bekommt",   pret: "bekam",    parf: "hat bekommen",     fr: "recevoir" },
  { inf: "biegen",    pres: "biegt",     pret: "bog",      parf: "ist gebogen",      fr: "tourner" },
  { inf: "bieten",    pres: "bietet",    pret: "bot",      parf: "hat geboten",      fr: "offrir" },
  { inf: "bitten",    pres: "bittet",    pret: "bat",      parf: "hat gebeten",      fr: "prier, demander" },
  { inf: "bleiben",   pres: "bleibt",    pret: "blieb",    parf: "ist geblieben",    fr: "rester" },
  { inf: "brechen",   pres: "bricht",    pret: "brach",    parf: "hat gebrochen",    fr: "casser", star: true },
  { inf: "bringen",     pres: "bringt",      pret: "brachte",   parf: "hat gebracht",    fr: "apporter" },
  { inf: "denken",      pres: "denkt",       pret: "dachte",    parf: "hat gedacht",     fr: "penser" },
  { inf: "empfehlen",   pres: "empfiehlt",   pret: "empfahl",   parf: "hat empfohlen",   fr: "recommander", star: true },
  { inf: "entscheiden", pres: "entscheidet", pret: "entschied", parf: "hat entschieden", fr: "décider" },
  { inf: "erschrecken", pres: "erschrickt",  pret: "erschrak",  parf: "ist erschrocken", fr: "s’effrayer", star: true },
  { inf: "essen",       pres: "isst",        pret: "aß",        parf: "hat gegessen",    fr: "manger", star: true },
  { inf: "fahren",      pres: "fährt",       pret: "fuhr",      parf: "ist gefahren",    fr: "aller (en véhicule)", star: true },
  { inf: "fallen",      pres: "fällt",       pret: "fiel",      parf: "ist gefallen",    fr: "tomber", star: true },
  { inf: "finden",      pres: "findet",      pret: "fand",      parf: "hat gefunden",    fr: "trouver" },
  { inf: "fliegen",     pres: "fliegt",      pret: "flog",      parf: "ist geflogen",    fr: "voler" }
];

const LABELS = { inf: "Infinitif", pres: "Présent (3e pers.)", pret: "Prétérit", parf: "Parfait" };
const MODES = { forms: ["pres", "pret", "parf"], fr: ["inf", "pres", "pret", "parf"] };

const $ = id => document.getElementById(id);
let mode, set, queue, current, status, checked, firstTry;

// Liste de révision
(function buildList() {
  let h = '<tr><th class="c-inf">Infinitif</th><th class="c-pres">Présent</th><th class="c-pret">Prétérit</th><th class="c-parf">Parfait</th><th class="c-fr">Traduction</th></tr>';
  for (const v of VERBS) {
    h += `<tr><td>${v.inf}</td><td>${v.star ? "*" : ""}er ${v.pres}</td><td>er ${v.pret}</td><td>er ${v.parf}</td><td>${v.fr}</td></tr>`;
  }
  $("list").innerHTML = h;
})();

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function norm(s) {
  return s.toLowerCase().replace(/\s+/g, " ").trim().replace(/^(er|sie|es)\s+/, "");
}
function noUml(s) {
  return s.replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u")
          .replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u").replace(/ß/g, "ss");
}

function check(field, value, v) {
  const got = norm(value), exp = v[field];
  if (!got) return { ok: false, msg: "Réponse attendue : " + display(field, v) };
  if (got === exp) return { ok: true };
  if (noUml(got) === noUml(exp)) return { ok: false, msg: "Presque ! Attention à ä, ö, ü ou ß : " + display(field, v) };
  if (field === "parf") {
    const [aux, ...rest] = exp.split(" ");
    const part = rest.join(" ");
    if (got === part) return { ok: false, msg: `Il manque l’auxiliaire : ${display(field, v)}` };
    const gotParts = got.split(" ");
    if (gotParts.length >= 2 && gotParts.slice(1).join(" ") === part && gotParts[0] !== aux)
      return { ok: false, msg: `Mauvais auxiliaire, c’est « ${aux} » : ${display(field, v)}` };
  }
  return { ok: false, msg: "Réponse attendue : " + display(field, v) };
}
function display(field, v) { return field === "inf" ? v.inf : "er " + v[field]; }

function start(m) {
  mode = m;
  const r = document.querySelector('input[name="range"]:checked').value;
  const all = [...VERBS.keys()];
  set = r === "a" ? all.slice(0, 10) : r === "b" ? all.slice(10, 20) : all;
  queue = shuffle([...set]);
  status = VERBS.map(() => "todo");
  firstTry = VERBS.map(() => null);
  $("home").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  next();
}

function renderProgress() {
  $("progress").innerHTML = set.map(i =>
    `<span class="dot ${status[i] === "done" ? "done" : firstTry[i] === false ? "missed" : ""} ${i === current ? "current" : ""}" title="${VERBS[i].inf}"></span>`
  ).join("");
}

function next() {
  if (!queue.length) return finish();
  current = queue.shift();
  checked = false;
  const v = VERBS[current];
  $("prompt").innerHTML = mode === "forms"
    ? `<div class="big">${v.inf}</div><div class="sub">${v.fr}</div>`
    : `<div class="big">${v.frHint || v.fr}</div><div class="sub">Écris le verbe allemand et ses formes</div>`;
  $("fields").innerHTML = MODES[mode].map(f => `
    <div class="field f-${f}" data-field="${f}">
      <label for="in-${f}">${LABELS[f]}</label>
      <div class="row">${f === "inf" ? "" : '<span class="pron">er</span>'}
        <input id="in-${f}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
      </div>
      <div class="fb"></div>
    </div>`).join("");
  $("verdict").classList.add("hidden");
  $("keys").classList.remove("hidden");
  $("action").textContent = "Vérifier";
  renderProgress();
  const inputs = [...document.querySelectorAll("#fields input")];
  inputs.forEach((inp, i) => {
    inp.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      if (checked) return action();
      if (i < inputs.length - 1) inputs[i + 1].focus(); else action();
    });
  });
  inputs[0].focus();
}

function verify() {
  const v = VERBS[current];
  let allOk = true;
  document.querySelectorAll("#fields .field").forEach(el => {
    const f = el.dataset.field;
    const inp = el.querySelector("input");
    const r = check(f, inp.value, v);
    el.classList.add(r.ok ? "ok" : "ko");
    inp.readOnly = true;
    let fb = r.ok ? "✓ Juste" : r.msg;
    if (f === "pres" && v.star) fb += '<span class="note">* Le présent change de voyelle.</span>';
    el.querySelector(".fb").innerHTML = fb;
    if (!r.ok) allOk = false;
  });
  if (firstTry[current] === null) firstTry[current] = allOk;
  const verdict = $("verdict");
  verdict.classList.remove("hidden", "good", "bad");
  if (allOk) {
    status[current] = "done";
    verdict.textContent = "Tout est juste !";
    verdict.classList.add("good");
  } else {
    queue.push(current);
    verdict.textContent = "Ce verbe reviendra plus tard.";
    verdict.classList.add("bad");
    const card = $("card");
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  }
  $("keys").classList.add("hidden");
  $("action").textContent = queue.length ? "Verbe suivant" : "Voir le résultat";
  checked = true;
  renderProgress();
  $("action").focus();
}

function action() { checked ? next() : verify(); }

function finish() {
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  const n = set.length;
  const good = set.filter(i => firstTry[i]).length;
  $("score").textContent = `${good} / ${n}`;
  $("comment").textContent =
    good === n ? "Parfait, aucune erreur !" :
    good >= 0.7 * n ? "Très bien. Encore un tour et ce sera parfait." :
    good >= 0.4 * n ? "C’est en bonne voie. Refais un tour pour les fixer." :
    "Relis la liste puis réessaie : ça rentre à force de répéter.";
  const missed = set.filter(i => !firstTry[i]).map(i => VERBS[i]);
  $("missed").innerHTML = missed.length
    ? "<p>À revoir :</p><ul>" + missed.map(v => `<li><strong>${v.inf}</strong> – er ${v.pres}, er ${v.pret}, er ${v.parf}</li>`).join("") + "</ul>"
    : "";
}

document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => start(b.dataset.mode)));
$("action").addEventListener("click", action);
$("again").addEventListener("click", () => start(mode));
$("home-btn").addEventListener("click", () => { $("result").classList.add("hidden"); $("home").classList.remove("hidden"); });
$("quit").addEventListener("click", () => { $("quiz").classList.add("hidden"); $("home").classList.remove("hidden"); });

// Touches ä ö ü ß : insèrent dans le champ actif sans lui faire perdre le focus
let lastInput = null;
document.addEventListener("focusin", e => { if (e.target.matches("#fields input")) lastInput = e.target; });
document.querySelectorAll(".key").forEach(k => {
  k.addEventListener("mousedown", e => e.preventDefault());
  k.addEventListener("click", () => {
    const inp = lastInput;
    if (!inp || inp.readOnly) return;
    const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? inp.value.length;
    inp.value = inp.value.slice(0, s) + k.textContent + inp.value.slice(e);
    inp.focus();
    inp.setSelectionRange(s + 1, s + 1);
  });
});
</script>
</body>
</html>
