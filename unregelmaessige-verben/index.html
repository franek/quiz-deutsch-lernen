<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verbes irréguliers allemands – entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F6FA;
  --paper: #FFFFFF;
  --ink: #1E2A44;
  --muted: #5B6680;
  --line: #D6DCE8;
  --aqua: #7FE0E6;
  --green: #74DB6A;
  --yellow: #EEF23A;
  --orange: #FFB43A;
  --violet: #DDA6F5;
  --ok: #1F8A3B;
  --ko: #C2342B;
  --warn: #A86400;
  --btn: #1E2A44;
  --btn-ink: #FFFFFF;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141826; --paper: #1D2234; --ink: #E8ECF6; --muted: #A3ABC2; --line: #333B55;
    --aqua: #2E8C92; --green: #3C8F36; --yellow: #8E9120; --orange: #A86A12; --violet: #7E4E96;
    --ok: #5FD07A; --ko: #FF7A70; --warn: #F0B04A; --btn: #E8ECF6; --btn-ink: #141826;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141826; --paper: #1D2234; --ink: #E8ECF6; --muted: #A3ABC2; --line: #333B55;
  --aqua: #2E8C92; --green: #3C8F36; --yellow: #8E9120; --orange: #A86A12; --violet: #7E4E96;
  --ok: #5FD07A; --ko: #FF7A70; --warn: #F0B04A; --btn: #E8ECF6; --btn-ink: #141826;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 17px; line-height: 1.5;
}
main { max-width: 620px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
h1 { font-size: 1.7rem; line-height: 1.2; margin: .5rem 0 .4rem; font-weight: 700; }
h1 .hl { background: linear-gradient(transparent 55%, var(--yellow) 55%); padding: 0 .15em; }
p.lead { color: var(--muted); margin: 0 0 1.5rem; }
.hidden { display: none !important; }

.modes { display: grid; gap: .75rem; }
.range-title { font-weight: 500; margin: 0 0 .5rem; }
.range { display: flex; gap: .5rem; margin: 0 0 .6rem; flex-wrap: wrap; }
.gift-pill {
  display: inline-block; margin: -.75rem 0 1.5rem; padding: .45rem .9rem; border-radius: 14px;
  background: var(--violet); font-size: .95rem; line-height: 1.4;
}
.range-hint { color: var(--muted); font-size: .95rem; margin: 0 0 1.25rem; min-height: 1.5em; }
.progress-text { color: var(--muted); font-weight: 500; }
.num { display: inline-block; min-width: 1.8em; color: var(--muted); font-size: .85em; }
.range label { cursor: pointer; position: relative; }
.range input { position: absolute; opacity: 0; pointer-events: none; }
.range span { display: inline-block; padding: .45rem .95rem; border-radius: 999px; border: 2px solid var(--line); background: var(--paper); font-weight: 500; }
.range input:checked + span { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.range input:focus-visible + span { outline: 3px solid var(--orange); outline-offset: 2px; }
.mode {
  text-align: left; width: 100%; padding: 1rem 1.1rem; border-radius: 14px;
  border: 2px solid var(--line); background: var(--paper); color: var(--ink);
  font: inherit; cursor: pointer;
}
.mode strong { display: block; font-size: 1.1rem; }
.mode span { color: var(--muted); font-size: .95rem; }
.mode:hover { border-color: var(--ink); }
.mode:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

details { margin-top: 1.75rem; }
summary {
  cursor: pointer; font-weight: 700; font-size: 1.1rem; list-style: none;
  display: flex; justify-content: space-between; align-items: center;
  padding: 1rem 1.1rem; border-radius: 14px; border: 2px solid var(--line); background: var(--paper);
}
summary::-webkit-details-marker { display: none; }
summary::after { content: "▾"; font-size: 1.3rem; line-height: 1; transition: transform .2s; }
details[open] summary::after { transform: rotate(180deg); }
summary:hover { border-color: var(--ink); }
summary:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.table-wrap {
  overflow-x: auto; margin-top: .75rem; background: var(--paper); border-radius: 12px; border: 1px solid var(--line);
  /* Sort de la colonne de 620px pour que le tableau tienne en entier sur ordinateur et tablette. */
  width: min(900px, calc(100vw - 2rem)); position: relative; left: 50%; transform: translateX(-50%);
}
table { border-collapse: collapse; width: 100%; font-size: 1rem; }
th, td { padding: .45rem .6rem; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-weight: 500; }
th.c-inf { background: var(--aqua); } th.c-pres { background: var(--green); }
th.c-pret { background: var(--yellow); } th.c-parf { background: var(--orange); } th.c-fr { background: var(--violet); }
tr:last-child td { border-bottom: 0; }
/* Sur téléphone, cinq colonnes ne tiennent pas : une fiche par verbe à la place. */
@media (max-width: 640px) {
  .table-wrap { overflow: visible; }
  table, tbody, td { display: block; }
  tr:first-child { display: none; }
  tr {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: .35rem .5rem;
    padding: .75rem .8rem; border-bottom: 1px solid var(--line);
  }
  tr:last-child { border-bottom: 0; }
  td { border: 0; padding: 0; white-space: normal; }
  td:nth-child(1) { font-weight: 700; font-size: 1.05rem; }
  td:nth-child(5) { grid-column: 2 / 4; grid-row: 1; text-align: right; color: var(--muted); align-self: center; }
  td:nth-child(2), td:nth-child(3), td:nth-child(4) { font-size: .92rem; padding-left: .45rem; border-left: 4px solid; }
  td:nth-child(2) { border-color: var(--green); }
  td:nth-child(3) { border-color: var(--yellow); }
  td:nth-child(4) { border-color: var(--orange); }
}

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
.link { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; padding: .3rem 0; text-decoration: underline; }
.progress { display: flex; gap: 5px; flex-wrap: wrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.dot.done { background: var(--green); border-color: var(--green); }
.dot.missed { background: var(--orange); border-color: var(--orange); }
.dot.current { border-color: var(--ink); }

.card { background: var(--paper); border-radius: 18px; padding: 1.4rem 1.2rem; border: 1px solid var(--line); }
.prompt { margin-bottom: 1.2rem; }
.prompt .big { font-size: 2rem; font-weight: 700; line-height: 1.15; word-break: break-word; }
.prompt .sub { color: var(--muted); margin-top: .2rem; }

.field { margin-bottom: 1.1rem; }
.field label { display: inline-block; font-weight: 500; font-size: .95rem; margin-bottom: .3rem; padding: 0 .3em; border-radius: 4px; }
.f-inf label { background: var(--aqua); } .f-pres label { background: var(--green); }
.f-pret label { background: var(--yellow); } .f-parf label { background: var(--orange); }
.row { display: flex; align-items: baseline; gap: .5rem; }
.pron { font-weight: 500; color: var(--muted); }
.field input {
  flex: 1; min-width: 0; font: inherit; font-size: 1.15rem; color: var(--ink);
  background: transparent; border: 0; border-bottom: 3px solid var(--line);
  padding: .35rem .1rem; border-radius: 0;
}
.f-inf input:focus { border-color: var(--aqua); } .f-pres input:focus { border-color: var(--green); }
.f-pret input:focus { border-color: var(--yellow); } .f-parf input:focus { border-color: var(--orange); }
.field input:focus { outline: none; }
.field.ok input { border-color: var(--ok); }
.field.ko input { border-color: var(--ko); }
.fb { font-size: .95rem; margin-top: .3rem; min-height: 0; }
.field.ok .fb { color: var(--ok); }
.field.ko .fb { color: var(--ko); }
.fb .note { color: var(--warn); display: block; }

.keys { display: flex; gap: .5rem; margin: .4rem 0 1.2rem; }
.key {
  font: inherit; font-size: 1.15rem; width: 48px; height: 44px; border-radius: 10px;
  border: 2px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
}
.key:active { transform: translateY(1px); }

.main-btn {
  width: 100%; font: inherit; font-weight: 700; font-size: 1.1rem; padding: .85rem 1rem;
  border-radius: 12px; border: 0; background: var(--btn); color: var(--btn-ink); cursor: pointer;
}
.verdict { font-weight: 700; margin: 0 0 1rem; font-size: 1.05rem; }
.verdict.good { color: var(--ok); } .verdict.bad { color: var(--ko); }

.result .score { font-size: 3.2rem; font-weight: 700; line-height: 1; margin: .5rem 0; }
.result ul { padding-left: 1.2rem; }
.result li { margin-bottom: .3rem; }
.btns { display: grid; gap: .6rem; margin-top: 1.4rem; }

.gift { margin-top: 1.4rem; padding-top: 1.2rem; border-top: 2px dashed var(--line); }
.gift-title { font-weight: 700; font-size: 1.15rem; margin: 0 0 .2rem; }
.gift-title .hl { background: linear-gradient(transparent 55%, var(--violet) 55%); padding: 0 .15em; }
.gift p { margin: 0 0 .8rem; color: var(--muted); }
.gift-video {
  position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; padding: 0; overflow: hidden;
  border: 0; border-radius: 12px; background: #000 center / cover no-repeat; cursor: pointer;
}
.gift-video::after {
  content: "▶"; position: absolute; inset: 0; margin: auto; width: 68px; height: 68px; border-radius: 50%;
  display: grid; place-items: center; padding-left: 5px; font-size: 1.7rem;
  background: rgba(255,255,255,.92); color: #1E2A44; box-shadow: 0 2px 12px rgba(0,0,0,.35);
}
.gift-video:hover::after { transform: scale(1.06); }
.gift-video:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.gift iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 12px; background: #000; }
.gift-label { margin: .6rem 0 0 !important; font-size: .8rem; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
.gift-name { font-weight: 500; margin: .1rem 0 0; color: var(--ink) !important; }
.gift-link { font-size: .9rem; color: var(--muted); }
.second-btn {
  width: 100%; font: inherit; font-weight: 500; padding: .8rem 1rem; border-radius: 12px;
  border: 2px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer;
}
@media (prefers-reduced-motion: no-preference) {
  .card.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
}
</style>
</head>
<body>
<main>

  <section id="home">
    <a class="link" href="../">← Tous les quiz</a>
    <h1>Verbes <span class="hl">irréguliers</span></h1>
    <p class="lead">Toute la fiche, de <em>anfangen</em> à <em>ziehen</em>. Les verbes ratés reviennent à la fin jusqu’à ce que tout soit juste.</p>
    <p class="gift-pill">🎁 Au moins 80&nbsp;% de justes du premier coup&nbsp;? <strong>Un cadeau t’attend à la fin&nbsp;!</strong></p>
    <p class="range-title">Quels verbes ?</p>
    <div class="range" role="radiogroup" id="ranges"></div>
    <p class="range-hint" id="range-hint"></p>
    <div class="modes">
      <button class="mode" data-mode="forms">
        <strong>Les trois formes</strong>
        <span>On te donne l’infinitif, tu écris le présent, le prétérit et le parfait.</span>
      </button>
      <button class="mode" data-mode="fr">
        <strong>À partir du français</strong>
        <span>On te donne la traduction, tu écris l’infinitif et les trois formes.</span>
      </button>
    </div>
    <details>
      <summary>Revoir la liste</summary>
      <div class="table-wrap"><table id="list"></table></div>
    </details>
  </section>

  <section id="quiz" class="hidden">
    <div class="topbar">
      <div class="progress" id="progress"></div>
      <button class="link" id="quit">Quitter</button>
    </div>
    <div class="card" id="card">
      <div class="prompt" id="prompt"></div>
      <div id="fields"></div>
      <div class="keys" id="keys">
        <button class="key" type="button">ä</button>
        <button class="key" type="button">ö</button>
        <button class="key" type="button">ü</button>
        <button class="key" type="button">ß</button>
      </div>
      <p class="verdict hidden" id="verdict"></p>
      <button class="main-btn" id="action">Vérifier</button>
    </div>
  </section>

  <section id="result" class="hidden result">
    <div class="card">
      <p style="margin:0;color:var(--muted)">Justes du premier coup</p>
      <div class="score" id="score"></div>
      <p id="comment"></p>
      <div id="missed"></div>
      <div id="gift" class="gift"></div>
      <div class="btns">
        <button class="main-btn" id="again">Recommencer</button>
        <button class="second-btn" id="home-btn">Changer d’exercice</button>
      </div>
    </div>
  </section>

</main>
<script src="karambolage.js"></script>

    alt: { inf: ["Sport treiben", "treiben"] } },
  { inf: "trinken",     pres: "trinkt",      pret: "trank",     parf: "hat getrunken",   fr: "boire" },

  { inf: "vergessen",   pres: "vergisst",    pret: "vergaß",    parf: "hat vergessen",   fr: "oublier", star: true },
  { inf: "vergleichen", pres: "vergleicht",  pret: "verglich",  parf: "hat verglichen",  fr: "comparer" },
  { inf: "verlieren",   pres: "verliert",    pret: "verlor",    parf: "hat verloren",    fr: "perdre" },
  { inf: "verschwinden", pres: "verschwindet", pret: "verschwand", parf: "ist verschwunden", fr: "disparaître" },

  { inf: "waschen",     pres: "wäscht",      pret: "wusch",     parf: "hat gewaschen",   fr: "laver", star: true },
  { inf: "werben",      pres: "wirbt",       pret: "warb",      parf: "hat geworben",    fr: "faire de la publicité", star: true },
  { inf: "werfen",      pres: "wirft",       pret: "warf",      parf: "hat geworfen",    fr: "jeter", star: true },
  { inf: "wissen",      pres: "weiß",        pret: "wusste",    parf: "hat gewusst",     fr: "savoir", star: true },
  { inf: "ziehen",      pres: "zieht",       pret: "zog",       parf: "hat/ist gezogen", fr: "tirer, aller" },
  // Ajouté à la main en bas de la page 131
  { inf: "haben",       pres: "hat",         pret: "hatte",     parf: "hat gehabt",      fr: "avoir" }

const LABELS = { inf: "Infinitif", pres: "Présent (3e pers.)", pret: "Prétérit", parf: "Parfait" };
const MODES = { forms: ["pres", "pret", "parf"], fr: ["inf", "pres", "pret", "parf"] };

const $ = id => document.getElementById(id);
let mode, set, queue, current, status, checked, firstTry;

const pron = v => v.pron || "er";

// Liste de révision
(function buildList() {
  let h = '<tr><th class="c-inf">Infinitif</th><th class="c-pres">Présent</th><th class="c-pret">Prétérit</th><th class="c-parf">Parfait</th><th class="c-fr">Traduction</th></tr>';
  VERBS.forEach((v, i) => {
    h += `<tr><td><span class="num">${i + 1}</span>${v.inf}</td><td>${v.star ? "*" : ""}${pron(v)} ${v.pres}</td><td>${pron(v)} ${v.pret}</td><td>${pron(v)} ${v.parf}</td><td>${v.fr}</td></tr>`;
  });
  $("list").innerHTML = h;
})();

// Séries : une par tranche de 10, toute la fiche, ou 20 verbes au hasard
const SERIES = [];
// Un reste de moins de 5 verbes est rattaché à la série précédente (ex. 81 à 93 plutôt que 91 à 93).
for (let s = 0, e; s < VERBS.length; s = e) {
  e = VERBS.length - (s + 10) < 5 ? VERBS.length : s + 10;
  SERIES.push({ id: "s" + s, label: `${s + 1} à ${e}`, pick: () => [...VERBS.keys()].slice(s, e),
    hint: `De <em>${VERBS[s].inf}</em> à <em>${VERBS[e - 1].inf}</em>.` });
}
SERIES.push({ id: "all", label: `Les ${VERBS.length}`, pick: () => [...VERBS.keys()],
  hint: `Toute la fiche : ${VERBS.length} verbes.` });
SERIES.push({ id: "rand", label: "20 au hasard", pick: () => shuffle([...VERBS.keys()]).slice(0, 20),
  hint: "20 verbes tirés au hasard dans toute la fiche, différents à chaque fois." });

const RANGE_KEY = "verbes-serie";
let savedRange = null;
try { savedRange = localStorage.getItem(RANGE_KEY); } catch (e) {}
if (!SERIES.some(s => s.id === savedRange)) savedRange = SERIES[0].id;
$("ranges").innerHTML = SERIES.map(s =>
  `<label><input type="radio" name="range" value="${s.id}"${s.id === savedRange ? " checked" : ""}><span>${s.label}</span></label>`
).join("");
function showRangeHint() {
  const id = document.querySelector('input[name="range"]:checked').value;
  $("range-hint").innerHTML = SERIES.find(s => s.id === id).hint;
}
$("ranges").addEventListener("change", () => {
  showRangeHint();
  try { localStorage.setItem(RANGE_KEY, document.querySelector('input[name="range"]:checked').value); } catch (e) {}
});
showRangeHint();

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function norm(s) {
  return s.toLowerCase().replace(/\s+/g, " ").trim().replace(/^(er|sie|es)\s+/, "");
}
function noUml(s) {
  return s.replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u")
          .replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u").replace(/ß/g, "ss");
}

// Réponses acceptées pour un champ, normalisées. « hat/ist gezogen » accepte les deux auxiliaires.
function answers(field, v) {
  const out = [];
  for (const a of [v[field], ...((v.alt && v.alt[field]) || [])]) {
    const m = a.match(/^(hat|ist)\/(hat|ist) (.*)$/);
    if (m) out.push(`${m[1]} ${m[3]}`, `${m[2]} ${m[3]}`);
    out.push(a);
  }
  return out.map(norm);
}

function check(field, value, v) {
  const got = norm(value), exps = answers(field, v), exp = exps[0];
  if (!got) return { ok: false, msg: "Réponse attendue : " + display(field, v) };
  if (exps.includes(got)) return { ok: true };
  if (exps.some(e => noUml(e) === noUml(got))) return { ok: false, msg: "Presque ! Attention à ä, ö, ü ou ß : " + display(field, v) };
  if (field === "parf") {
    const [aux, ...rest] = exp.split(" ");
    const part = rest.join(" ");
    if (got === part) return { ok: false, msg: `Il manque l’auxiliaire : ${display(field, v)}` };
    const gotParts = got.split(" ");
    if (gotParts.length >= 2 && gotParts.slice(1).join(" ") === part && gotParts[0] !== aux)
      return { ok: false, msg: `Mauvais auxiliaire, c’est « ${aux} » : ${display(field, v)}` };
  }
  return { ok: false, msg: "Réponse attendue : " + display(field, v) };
}
function display(field, v) { return field === "inf" ? v.inf : pron(v) + " " + v[field]; }

function start(m) {
  mode = m;
  const r = document.querySelector('input[name="range"]:checked').value;
  set = SERIES.find(s => s.id === r).pick();
  queue = shuffle([...set]);
  status = VERBS.map(() => "todo");
  firstTry = VERBS.map(() => null);
  $("home").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  next();
}

function renderProgress() {
  // Au-delà de 30 verbes, les pastilles prendraient trop de place : un compteur suffit.
  if (set.length > 30) {
    const done = set.filter(i => status[i] === "done").length;
    $("progress").innerHTML = `<span class="progress-text">${done} / ${set.length} verbes</span>`;
    return;
  }
  $("progress").innerHTML = set.map(i =>
    `<span class="dot ${status[i] === "done" ? "done" : firstTry[i] === false ? "missed" : ""} ${i === current ? "current" : ""}" title="${VERBS[i].inf}"></span>`
  ).join("");
}

function next() {
  if (!queue.length) return finish();
  current = queue.shift();
  checked = false;
  const v = VERBS[current];
  $("prompt").innerHTML = mode === "forms"
    ? `<div class="big">${v.inf}</div><div class="sub">${v.fr}</div>`
    : `<div class="big">${v.frHint || v.fr}</div><div class="sub">Écris le verbe allemand et ses formes</div>`;
  $("fields").innerHTML = MODES[mode].map(f => `
    <div class="field f-${f}" data-field="${f}">
      <label for="in-${f}">${LABELS[f]}</label>
      <div class="row">${f === "inf" ? "" : `<span class="pron">${pron(v)}</span>`}
        <input id="in-${f}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
      </div>
      <div class="fb"></div>
    </div>`).join("");
  $("verdict").classList.add("hidden");
  $("keys").classList.remove("hidden");
  $("action").textContent = "Vérifier";
  renderProgress();
  const inputs = [...document.querySelectorAll("#fields input")];
  inputs.forEach((inp, i) => {
    inp.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      if (checked) return action();
      if (i < inputs.length - 1) inputs[i + 1].focus(); else action();
    });
  });
  inputs[0].focus();
}

function verify() {
  const v = VERBS[current];
  let allOk = true;
  document.querySelectorAll("#fields .field").forEach(el => {
    const f = el.dataset.field;
    const inp = el.querySelector("input");
    const r = check(f, inp.value, v);
    el.classList.add(r.ok ? "ok" : "ko");
    inp.readOnly = true;
    let fb = r.ok ? "✓ Juste" : r.msg;
    if (f === "pres" && v.star) fb += '<span class="note">* Le présent change de voyelle.</span>';
    el.querySelector(".fb").innerHTML = fb;
    if (!r.ok) allOk = false;
  });
  if (firstTry[current] === null) firstTry[current] = allOk;
  const verdict = $("verdict");
  verdict.classList.remove("hidden", "good", "bad");
  if (allOk) {
    status[current] = "done";
    verdict.textContent = "Tout est juste !";
    verdict.classList.add("good");
  } else {
    queue.push(current);
    verdict.textContent = "Ce verbe reviendra plus tard.";
    verdict.classList.add("bad");
    const card = $("card");
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  }
  $("keys").classList.add("hidden");
  $("action").textContent = queue.length ? "Verbe suivant" : "Voir le résultat";
  checked = true;
  renderProgress();
  $("action").focus();
}

function action() { checked ? next() : verify(); }

function finish() {
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  const n = set.length;
  const good = set.filter(i => firstTry[i]).length;
  $("score").textContent = `${good} / ${n}`;
  $("comment").textContent =
    good === n ? "Parfait, aucune erreur !" :
    good >= 0.7 * n ? "Très bien. Encore un tour et ce sera parfait." :
    good >= 0.4 * n ? "C’est en bonne voie. Refais un tour pour les fixer." :
    "Relis la liste puis réessaie : ça rentre à force de répéter.";
  const missed = set.filter(i => !firstTry[i]).map(i => VERBS[i]);
  $("missed").innerHTML = missed.length
    ? "<p>À revoir :</p><ul>" + missed.map(v => `<li><strong>${v.inf}</strong> – ${pron(v)} ${v.pres}, ${pron(v)} ${v.pret}, ${pron(v)} ${v.parf}</li>`).join("") + "</ul>"
    : "";
  // Cadeau à partir de 80 % de verbes justes du premier coup, sinon un encouragement.
  const needed = Math.ceil(n * 4 / 5);
  if (good >= needed) showGift();
  else $("gift").innerHTML = `
    <p class="gift-title">🎁 Un <span class="hl">cadeau</span> t’attend…</p>
    <p>… à partir de ${needed} / ${n} verbes justes du premier coup (80 %). Il t’en manque ${needed - good}. Refais un tour !</p>`;
}

// Cadeau : une vidéo Karambolage tirée au hasard dans karambolage.js, parmi celles encore en ligne.
// Le lecteur ARTE n'est chargé qu'au clic : rien ne se lance ni ne se télécharge tout seul.
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
function showGift() {
  const today = new Date().toISOString().slice(0, 10);
  const list = (typeof KARAMBOLAGE === "undefined" ? [] : KARAMBOLAGE).filter(v => v[4] > today);
  if (!list.length) {
    $("gift").innerHTML = `
      <p class="gift-title">🎁 Ton <span class="hl">cadeau</span></p>
      <p>Va voir les vidéos de <a href="https://www.arte.tv/fr/videos/RC-014034/karambolage/" target="_blank" rel="noopener"><em>Karambolage</em> sur arte.tv</a>.</p>`;
    return;
  }
  const [id, label, title, img] = list[Math.floor(Math.random() * list.length)];
  const t = esc(title);
  $("gift").innerHTML = `
    <p class="gift-title">🎁 Ton <span class="hl">cadeau</span></p>
    <p>Une vidéo de <em>Karambolage</em>, l’émission d’ARTE qui s’amuse des petites différences entre les pays. Il y en a ${list.length}, une nouvelle à chaque fois !</p>
    <button class="gift-video" type="button" id="gift-play" style="background-image:url('https://api-cdn.arte.tv/img/v2/image/${img}/640x360')" aria-label="Regarder la vidéo : ${t}"></button>
    <p class="gift-label">${esc(KARAMBOLAGE_LABELS[label])}</p>
    <p class="gift-name">${t}</p>
    <a class="gift-link" href="https://www.arte.tv/fr/videos/${id}/" target="_blank" rel="noopener">Regarder sur arte.tv</a>`;
  $("gift-play").addEventListener("click", () => {
    const f = document.createElement("iframe");
    f.src = `https://www.arte.tv/embeds/fr/${id}?autoplay=true`;
    f.title = "Karambolage – " + title;
    f.allow = "autoplay; fullscreen; picture-in-picture";
    f.allowFullscreen = true;
    $("gift-play").replaceWith(f);
  });
}

document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => start(b.dataset.mode)));
$("action").addEventListener("click", action);
$("again").addEventListener("click", () => start(mode));
$("home-btn").addEventListener("click", () => { $("result").classList.add("hidden"); $("home").classList.remove("hidden"); });
$("quit").addEventListener("click", () => { $("quiz").classList.add("hidden"); $("home").classList.remove("hidden"); });

// Aperçu de l'écran de fin sans faire le quiz : ajouter ?apercu à l'adresse (8 / 10),
// ou ?apercu=6 pour choisir le nombre de verbes justes sur la série 1 à 10.
const apercu = new URLSearchParams(location.search).get("apercu");
if (apercu !== null) {
  const good = /^\d+$/.test(apercu) ? Math.min(+apercu, 10) : 8;
  mode = "forms";
  set = [...VERBS.keys()].slice(0, 10);
  status = VERBS.map(() => "done");
  firstTry = VERBS.map((_, i) => i < good);
  $("home").classList.add("hidden");
  finish();
}

// Touches ä ö ü ß : insèrent dans le champ actif sans lui faire perdre le focus
let lastInput = null;
document.addEventListener("focusin", e => { if (e.target.matches("#fields input")) lastInput = e.target; });
document.querySelectorAll(".key").forEach(k => {
  k.addEventListener("mousedown", e => e.preventDefault());
  k.addEventListener("click", () => {
    const inp = lastInput;
    if (!inp || inp.readOnly) return;
    const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? inp.value.length;
    inp.value = inp.value.slice(0, s) + k.textContent + inp.value.slice(e);
    inp.focus();
    inp.setSelectionRange(s + 1, s + 1);
  });
});
</script>
